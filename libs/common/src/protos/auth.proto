syntax = "proto3";
import "google/protobuf/empty.proto";

package auth;

// Auth Service definition
service AuthService {

  // ---- AUTH MODULE ----
  // Sends a login request
  rpc Login (LoginRequest) returns (LoginResponse) {}
  // Sends a signup request
  rpc Signup (SignupRequest) returns (SignupResponse) {}
  // Refreshes the session of a user
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {}
  // Sets the password for a user account
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse) {}
  // Validates a one-time-use token (account setup, change password)
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {}
  // Validates a JWT (access or refresh token)
  rpc ValidateJwt(ValidateTokenRequest) returns (ValidateTokenResponse) {}
  // Initiates password reset flow by sending email with reset token
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {}
  // Changes a user's password (requires authentication)
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
  // Logs in with Microsoft token
  rpc LoginWithMicrosoft(LoginWithMicrosoftRequest) returns (LoginResponse) {}
  // Generates an account setup token for new users (used by invitation-service)
  rpc GenerateAccountSetupToken(GenerateAccountSetupTokenRequest) returns (GenerateAccountSetupTokenResponse) {}



  // ---- USERS MODULE ----
  // Creates a new user with platform roles
  rpc CreatePlatformUser (CreatePlatformUserRequest) returns (User) {}
  // Creates a basic user without roles, always inactive.
  rpc CreateBasicUser (CreateBasicUserRequest) returns (User) {}
  // Activates a pending user by setting their password
  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse);
  // Activates a user by linking their Microsoft account
  rpc ActivateUserWithMicrosoft(ActivateUserWithMicrosoftRequest) returns (ActivateUserResponse);
  // Activates a user using their token
  rpc ActivateUserWithToken(ActivateUserWithTokenRequest) returns (ActivateUserResponse);

  // Retrieves a user by their ID
  rpc GetUser (GetUserRequest) returns (User) {}
  // Retrieves a user by their email
  rpc GetUserByEmail (GetUserByEmailRequest) returns (User) {}
  rpc GetUsers (GetUsersRequest) returns (GetUsersResponse) {}
  rpc UpdateUser (UpdateUserRequest) returns (User) {}
  // Self-service profile edition: the caller can only change these fields of its own account
  rpc UpdateOwnProfile (UpdateOwnProfileRequest) returns (User) {}
  rpc DeactivateUser (DeactivateUserRequest) returns (DeactivateUserResponse) {}

  // ---- ROLES MODULE ----
  // Assigns platform roles to a user
  rpc AssignPlatformRoles(AssignPlatformRolesRequest) returns (AssignPlatformRolesResponse) {}
  // Retrieves roles by their IDs
  rpc GetRolesByIds(GetRolesByIdsRequest) returns (GetRolesByIdsResponse) {}
  // Retrieves all the roles in the system
  rpc GetRoles(google.protobuf.Empty) returns (GetRolesByIdsResponse) {}
  // Removes a platform role from a user (soft delete)
  rpc RemovePlatformRole(RemovePlatformRoleRequest) returns (RemovePlatformRoleResponse) {}

  // ---- PERMISSIONS MODULE ----
  // Gets a user's platform roles and permissions
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (GetUserPermissionsResponse) {}
  // Checks if a user is platform staff (has platform role)
  rpc IsPlatformStaff(IsPlatformStaffRequest) returns (IsPlatformStaffResponse) {}

}

// ---- AUTH MODULE REQUEST/RESPONSE ----

// The request message containing the user's credentials.
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginWithMicrosoftRequest {
  string token = 1;
}

// The response message containing the authentication tokens.
message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
}

// The request message containing the user's information.
message SignupRequest {
  string email = 1;
  string password = 2;
  string firstName = 3;
  string lastName = 4;
}

message SignupResponse {
  int32 id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
  bool active = 6;
  string status = 7;
}

// The request message for refreshing a token.
message RefreshRequest {
  string refreshToken = 1;
}

// The response message containing the new access token.
message RefreshResponse {
  string accessToken = 1;
}

// The request message for setting a user's password.
message SetPasswordRequest {
  string token = 1;
  string password = 2;
}

message SetPasswordResponse {
  bool success = 1;
}

// The request message for validating a token.
message ValidateTokenRequest {
  string token = 1;
}

// The response message for a token validation.
message ValidateTokenResponse {
  bool valid = 1;
  string tokenType = 2;
}

message ActivateUserRequest {
  int32 userId = 1;
  string password = 2;
}

message ActivateUserWithMicrosoftRequest {
  int32 userId = 1;
  string token = 2;
}

message ActivateUserWithTokenRequest {
  string token = 1;
}

message ActivateUserResponse {
  bool success = 1;
}

// The request message for initiating password reset.
message ForgotPasswordRequest {
  string email = 1;
}

// The response message for password reset request.
message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}

// The request message for changing a user's password.
message ChangePasswordRequest {
  int32 userId = 1;
  string oldPassword = 2;
  string newPassword = 3;
}

// The response message for password change.
message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

// The request message for generating an account setup token.
message GenerateAccountSetupTokenRequest {
  int32 userId = 1;
}

// The response message containing the account setup token.
message GenerateAccountSetupTokenResponse {
  string token = 1;
  string expiresAt = 2; // ISO 8601 timestamp
}

// ---- USER MODULE REQUEST/RESPONSE ----

// The request message for creating a new user with platform roles.
message CreatePlatformUserRequest {
  string firstName = 1;
  optional string lastName = 2;
  string email = 3;
  optional string phone = 4;
  repeated int32 roleIds = 5;
}

// The response message containing the newly created platform user.
message CreatePlatformUserResponse {
  int32 id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
  bool active = 6;
  string status = 7;
}

// The request message for creating a basic user.
message CreateBasicUserRequest {
  string firstName = 1;
  optional string lastName = 2;
  string email = 3;
  optional string phone = 4;
}

// The response message containing the newly created basic user.
message CreateBasicUserResponse {
  int32 id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
  bool active = 6;
  string status = 7;
}

// The request message for retrieving a user.
message GetUserRequest {
  int32 id = 1;
}

// The request message for retrieving a user by email.
message GetUserByEmailRequest {
  string email = 1;
}

// The request message for retrieving a list of users.
message GetUsersRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional bool includeInactive = 3;
}

message UpdateUserRequest {
  int32 id = 1;
  optional string firstName = 2;
  optional string lastName = 3;
  optional string phone = 4;
}

message UpdateOwnProfileRequest {
  int32 userId = 1;
  optional string firstName = 2;
  optional string lastName = 3;
  optional string phone = 4;
}

message DeactivateUserRequest {
  int32 id = 1;
}

message DeactivateUserResponse {
  bool success = 1;
}

// The response message containing the user details.
message GetUserResponse {
  int32 id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
  bool active = 6;
  string status = 7;
}

message User {
  int32 id = 1;
  string firstName = 2;
  optional string lastName = 3;
  string email = 4;
  optional string phone = 5;
  bool active = 6;
  string status = 7;
}

message PaginationMeta {
  int32 totalItems = 1;
  int32 itemsOnPage = 2;
  int32 itemsPerPage = 3;
  int32 totalPages = 4;
  int32 currentPage = 5;
}

message GetUsersResponse {
  repeated User users = 1;
  PaginationMeta meta = 2;
}

// ---- ROLES MODULE REQUEST/RESPONSE ----

// The request message for assigning platform roles to a user.
message AssignPlatformRolesRequest {
  int32 userId = 1;
  repeated int32 roleIds = 2;
}

// The response message for assigning platform roles.
message AssignPlatformRolesResponse {
  bool success = 1;
}

// The request message for retrieving roles by IDs.
message GetRolesByIdsRequest {
  repeated int32 roleIds = 1;
}

// The response message containing the roles.
message GetRolesByIdsResponse {
  repeated Role roles = 1;
}

// Role model
message Role {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string scope = 4;
}

// ---- PERMISSIONS MODULE REQUEST/RESPONSE ----

// The request message for getting a user's platform roles and permissions
message GetUserPermissionsRequest {
  int32 userId = 1;
}

// The response message containing the user's platform roles and flattened permissions
message GetUserPermissionsResponse {
  repeated PlatformRoleWithPermissions roles = 1;
  repeated string permissions = 2;  // Flattened: ["create:users", "read:events"]
}

// Platform role with basic information
message PlatformRoleWithPermissions {
  int32 id = 1;
  string name = 2;
  string scope = 3;  // Will be "PLATFORM"
}

// The request message for removing a platform role from a user
message RemovePlatformRoleRequest {
  int32 userId = 1;
  int32 roleId = 2;
}

// The response message for removing a platform role
message RemovePlatformRoleResponse {
  bool success = 1;
  string message = 2;
}

// The request message for checking if a user is platform staff
message IsPlatformStaffRequest {
  oneof identifier {
    int32 userId = 1;
    string email = 2;
  }
}

// The response message for platform staff check
message IsPlatformStaffResponse {
  bool isPlatformStaff = 1;
  optional Role role = 2;
}
