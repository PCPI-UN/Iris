syntax = "proto3";

package project;

service ProjectsService {
  rpc CreateProject (CreateProjectRequest)   returns (ProjectResponse);
  rpc GetProject    (GetProjectRequest)      returns (ProjectResponse);
  rpc GetProjectComplete    (GetProjectRequest)      returns (ProjectCompleteResponse);
  // Projects by id in one query, without participants, documents or tutors; ids that do not exist are left out
  rpc ListProjectsByIds (ListProjectsByIdsRequest) returns (ListProjectsResponse);
  rpc ListProjectsByEvent (ListProjectsByEventRequest) returns (ListProjectsResponse);
  rpc GetDashboardStats (GetProjectDashboardStatsRequest) returns (GetProjectDashboardStatsResponse);

  rpc CreateProjectWithPendingParticipants(CreateProjectWithParticipantsRequest)
      returns (CreateProjectWithParticipantsResponse);

  // Documentos: gRPC no es ideal para binarios grandes → patrón de URL firmada
  // rpc IssueUploadUrl (IssueUploadUrlRequest) returns (IssueUploadUrlResponse);
  rpc AddProjectDocumentFromUrl (AddProjectDocumentFromUrlRequest) returns (ProjectDocumentResponse);
  rpc ListProjectDocuments (ListProjectDocumentsRequest) returns (ListProjectDocumentsResponse);
  rpc UpdateProjectDocument (UpdateProjectDocumentRequest) returns (ProjectDocumentResponse);

  // Participantes
  rpc AddParticipant (AddParticipantRequest) returns (AddParticipantResponse);
  rpc ListParticipants (ListParticipantsRequest) returns (ListParticipantsResponse);
  rpc AddPendingParticipant (AddPendingParticipantRequest) returns (AddPendingParticipantResponse);
  rpc ListPendingParticipants (ListPendingParticipantsRequest) returns (ListPendingParticipantsResponse);

  // Links a platform user as tutor of the project and marks the pending tutor with that email as joined
  rpc AddProjectTutor (AddProjectTutorRequest) returns (AddProjectTutorResponse);
  // Replaces the tutors of a project (linked and pending); on an approved project, gives the Tutor role and invites the new pending ones
  rpc SetProjectTutors (SetProjectTutorsRequest) returns (SetProjectTutorsResponse);

  rpc UpdateProject (UpdateProjectRequest) returns (ProjectResponse);      
  rpc ApproveProject (ApproveProjectRequest) returns (ProjectResponse);
  rpc RejectProject (RejectProjectRequest) returns (ProjectResponse);
  rpc RequestChangesProject (RequestChangesProjectRequest) returns (ProjectResponse);
  rpc ChangeToUnderReviewProject (ChangeToUnderReviewProjectRequest) returns (ProjectResponse);
  rpc AssignJurorToProjects (AssignJurorToProjectsRequest) returns (AssignJurorToProjectsResponse); 
  rpc ReassignProjectJuror (ReassignProjectJurorRequest) returns (ReassignProjectJurorResponse);  
  rpc RemoveJurorFromProject (RemoveJurorFromProjectRequest) returns (RemoveJurorFromProjectResponse);
  rpc ListProjectJurors (ListProjectJurorsRequest) returns (ListProjectJurorsResponse);  
  rpc ListAssignedProjects(ListAssignedProjectsRequest) returns (ListAssignedProjectsResponse);
  rpc GetMyProjectByEvent (GetMyProjectByEventRequest) returns (GetMyProjectByEventResponse);
  // Course sections (NRC) of the academic term of an event, for the student to pick theirs when submitting a project
  rpc ListCourseSections (ListCourseSectionsRequest) returns (ListCourseSectionsResponse);
  rpc ListUserParticipations (ListUserParticipationsRequest) returns (ListUserParticipationsResponse);
  // Data of the student dashboard: participation statistics, history, current project and academic data
  rpc GetStudentParticipationStats (GetStudentParticipationStatsRequest) returns (GetStudentParticipationStatsResponse);

  rpc ListProjectsForReview(ListProjectsForReviewRequest) returns (ListProjectsForReviewResponse);
  rpc DeleteProject (DeleteProjectRequest) returns (DeleteProjectResponse);

  // Juror import from the PF spreadsheet: validates every row, writes nothing
  rpc PreviewJurorImport (PreviewJurorImportRequest) returns (PreviewJurorImportResponse);
  // Assigns the jurors of a confirmed juror import; refuses it when the preview cannot be confirmed
  rpc ExecuteJurorImport (ExecuteJurorImportRequest) returns (ExecuteJurorImportResponse);
  // Data to build the downloadable template: departments and approved projects of the event
  rpc GetJurorImportTemplate (GetJurorImportTemplateRequest) returns (GetJurorImportTemplateResponse);
  // Fails with PERMISSION_DENIED unless the user may read or edit the project: a confirmed
  // participant, an assigned juror (read only) or platform staff (read:events / manage:events)
  rpc CheckProjectAccess (CheckProjectAccessRequest) returns (CheckProjectAccessResponse);

  // Academic read endpoints: only the projects the user may read, from their scope permissions
  // (read_all, read_tutored, read_course, read_department :academic_projects)
  rpc ListProjectsInScope (ListProjectsInScopeRequest) returns (ListProjectsResponse);
  // NOT_FOUND when the project does not exist or is outside the user's scope
  rpc GetProjectInScope (GetProjectInScopeRequest) returns (ProjectComplete);
  rpc ListEventIdsInScope (ListEventIdsInScopeRequest) returns (ListEventIdsInScopeResponse);

  // Administrative changes of a project, most recent first; NOT_FOUND when the project does not exist
  rpc ListProjectChangeLog (ListProjectChangeLogRequest) returns (ListProjectChangeLogResponse);

  // Administrative change from any state to any other, with a reason. When the project has evaluations
  // or the event has published results and force is false, nothing changes and the answer carries `blocked`
  rpc AdminChangeProjectState (AdminChangeProjectStateRequest) returns (AdminChangeProjectStateResponse);

  // Administrative edit of the basic data and the category; never the state. A taken name or a
  // category change with evaluations (without force) changes nothing and the answer carries `conflict`
  rpc AdminUpdateProject (AdminUpdateProjectRequest) returns (AdminUpdateProjectResponse);

  // Administrative addition of a participant: enrolled (userId and studentCode) or pending. A student already
  // in the project or in another active project of the event changes nothing and the answer carries `rejected`
  rpc AdminAddParticipant (AdminAddParticipantRequest) returns (AdminAddParticipantResponse);
  // Administrative removal of an enrolled (userId) or pending (pendingId) participant. Removing the last
  // participant changes nothing and the answer carries `rejected`
  rpc AdminRemoveParticipant (AdminRemoveParticipantRequest) returns (AdminRemoveParticipantResponse);

}

enum ProjectState {
  PROJECT_STATE_UNSPECIFIED = 0;
  UNDER_REVIEW = 1;
  APPROVED = 2;
  REJECTED = 3;
  REQUEST_CHANGES = 4;
}

enum TypedDocument {
  DOC_UNSPECIFIED = 0;
  LOGO = 1;
  POSTER = 2;
  SUPPORTING_DOCUMENT = 3;
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

/************** Messages **************/
message JurorKey {
  int32 memberUserId = 1;
  int32 memberEventId = 2;
  int32 memberRoleId = 3;
}

message Project {
  int32 id = 1;
  int32 eventId = 2;
  string name = 3;
  optional string projectCode = 4;
  optional string description = 5;
  optional string eventNumber = 6;
  string createdAt = 7; 
  string updatedAt = 8; 
  int32 courseId = 9;
  ProjectState state = 10;
  optional string reason = 11;
}

message ProjectComplete {
  int32 id = 1;
  int32 eventId = 2;
  string name = 3;
  optional string description = 4;
  optional string eventNumber = 5;
  string createdAt = 6; 
  string updatedAt = 7; 
  int32 courseId = 8;
  ProjectState state = 9;
  optional string reason = 10;
  repeated ProjectParticipant participants = 11;
  repeated ProjectDocument documents = 12;
  repeated PendingProjectParticipant pendingParticipants = 13;
  optional string projectCode = 14;
  repeated ProjectTutor tutors = 15;
  // Only filled by the academic read endpoints; not set for the fill course sections: -1
  // (created before course sections existed) and 0 (event that does not require one)
  optional AcademicCourse academicCourse = 16;
  // Jurors assigned to evaluate the project; only filled by the academic read endpoints
  optional int32 assignedJurorCount = 17;
}

// Course section (NRC within an academic term) of a project, with its department
message AcademicCourse {
  int32 id = 1;
  string nrc = 2;
  int32 termId = 3;  // event-service term
  string name = 4;
  int32 professorUserId = 5;
  int32 departmentId = 6;
  string departmentName = 7;
}

// A tutor of a project: linked to a user account, or pending (typed in by the student, no account yet)
message ProjectTutor {
  optional int32 userId = 1;
  string firstName = 2;
  optional string lastName = 3;
  bool pending = 4;
  // Only filled for pending tutors; linked tutors expose no email
  optional string email = 5;
}

message PendingTutorInput {
  string firstName = 1;
  optional string lastName = 2;
  string email = 3;
}

message ProjectDocument {
  int32 id = 1;
  int32 projectId = 2;
  string url = 3;
  TypedDocument type = 4;
  string createdAt = 5;
  string updatedAt = 6;
  DocumentStatus state = 7;
}

message ProjectParticipant {
  int32 userId = 1;
  int32 projectId = 2;
  string studentCode = 3; 
  optional string firstName = 4;
  optional string lastName = 5;
  optional string email = 6;
  optional string semester = 7;
  optional string career = 8;
  string status = 9;
}

message PendingProjectParticipant {
  int32 pendingId = 1;
  int32 projectId = 2;
  string firstName = 3;
  string lastName = 4;
  string email = 5;
  string studentCode = 6;
  string semester = 7;
  string career = 8;
  string status = 9;
  string invitedAt = 10;
  string joinedAt = 11;
  string createdAt = 12;
  string updatedAt = 13;
}

message PendingParticipantInput {
  string firstName = 1;
  optional string lastName = 2;
  string email = 3;
  string studentCode = 4;
  string semester = 5;
  string career = 6;
  optional string status = 7; // PENDING (default), INVITED, JOINED - optional for public registration
}

message ProjectDocumentInput {
  string url = 1;
  TypedDocument type = 2;
}

/************** Requests/Responses **************/
message CreateProjectRequest {
  int32 eventId = 1;
  string name = 2;
  optional string description = 3;
  optional string eventNumber = 4;
  int32 courseId = 5;
  ProjectState state = 6; // opcional en la práctica; si no se envía, default en UC
  // NRC of the course section, looked up in the term of the event. Required when the event
  // requires a course section; ignored otherwise (the project gets course section 0)
  optional string nrc = 7;
}
message ProjectResponse { Project project = 1; }

message ProjectCompleteResponse { repeated ProjectComplete items = 1; }

message GetProjectRequest { int32 id = 1; }

message ListProjectsByIdsRequest { repeated int32 ids = 1; }

message ListProjectsByEventRequest {
  int32 eventId = 1;
  optional string q = 2;
  optional int32 currentPage = 3;           // page number (1-indexed)
  optional int32 itemsPerPage = 4;          // items per page
  optional int32 courseId = 5;
  optional ProjectState state = 6;   // filter by project state
}
message ListProjectsResponse {
  repeated ProjectComplete items = 1;
  int32 total = 2;
  int32 currentPage = 3;           // current page number
  int32 itemsOnCurrentPage = 4;
  int32 itemsPerPage = 5;          // items per page
  int32 totalPages = 6;     // total number of pages
}

message GetProjectDashboardStatsRequest {}

message GetProjectDashboardStatsResponse {
  int32 totalProjects = 1;
}


message UpdateProjectRequest {
  int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string eventNumber = 4;
  optional int32 courseId = 5;
  // The state only changes through AdminChangeProjectState and the review RPCs
  reserved 6;
  reserved "state";
  optional string projectCode = 7;
}

message ApproveProjectRequest { 
  int32 id = 1; 
  int32 actingUserId = 2; 
  string eventType = 3;
}

message RejectProjectRequest { 
  int32 id = 1; 
  int32 actingUserId = 2;
  optional string reason = 3; // Reason for rejection (stored in database)
  string eventType = 4;
}

message RequestChangesProjectRequest {
  int32 id = 1;
  int32 actingUserId = 2;
  string reason = 3;
}


message ChangeToUnderReviewProjectRequest {
  int32 id = 1;
  int32 actingUserId = 2;
}

// Service will:
// 1. Validate all projects exist and belong to the same event
// 2. Call event-service to verify userId is a juror in that event
// 3. Get the full JurorKey (userId, eventId, roleId) from event-service
// 4. Assign juror to all valid projects
message AssignJurorToProjectsRequest {
  int32 userId = 1;              // The user to assign as juror
  repeated int32 projectIds = 2; // Projects to assign (must all be in same event)
}
message AssignJurorToProjectsResponse {
  int32 assigned = 1;
  repeated FailedAssignment failures = 2;
}
message FailedAssignment {int32 projectId = 1;string reason = 2;}

// Service will:
// 1. Get project to determine eventId
// 2. Validate both fromUserId and toUserId are jurors in that event
// 3. Get full JurorKey for both users from event-service
// 4. Remove old assignment and create new assignment
message ReassignProjectJurorRequest {
  int32 projectId = 1;
  int32 fromUserId = 2;  // Current juror userId
  int32 toUserId = 3;    // New juror userId
}
message ReassignProjectJurorResponse { bool ok = 1; bool changed = 2; }

message RemoveJurorFromProjectRequest {
  int32 projectId = 1;
  int32 userId = 2;
}

message RemoveJurorFromProjectResponse {
  bool ok = 1;
  int32 projectId = 2;
  int32 userId = 3;
  string message = 4;
}

message ListProjectJurorsRequest { int32 projectId = 1; }
message ListProjectJurorsResponse { repeated JurorKey jurors = 1; }

message IssueUploadUrlRequest { int32 projectId = 1; string contentType = 2; }
message IssueUploadUrlResponse { string uploadUrl = 1; string publicUrl = 2; }

message AddProjectDocumentFromUrlRequest { int32 projectId = 1; string url = 2; TypedDocument type = 3; }
message ProjectDocumentResponse { ProjectDocument document = 1; }

message ListProjectDocumentsRequest { int32 projectId = 1; }
message ListProjectDocumentsResponse { repeated ProjectDocument items = 1; }

message AddParticipantRequest {  int32 projectId = 1;  int32 userId = 2;  string studentCode = 3;}
message AddParticipantResponse {  ProjectParticipant participant = 1; }

message ListParticipantsRequest {  int32 projectId = 1; }
message ListParticipantsResponse {  repeated ProjectParticipant items = 1;}

message AddPendingParticipantRequest {
  int32 projectId = 1;
  string firstName = 2;
  optional string lastName = 3;
  string email = 4;
  string studentCode = 5;
  string semester = 6;
  string career = 7;
  int32 status = 8;
}
message AddPendingParticipantResponse {
  PendingProjectParticipant participant = 1;
}

message AddProjectTutorRequest {
  int32 projectId = 1;
  int32 userId = 2;
  string email = 3;
}
message AddProjectTutorResponse { bool success = 1; }

message SetProjectTutorsRequest {
  int32 projectId = 1;
  repeated int32 tutorUserIds = 2;
  repeated PendingTutorInput pendingTutors = 3;
  // auth-service user making the change; recorded in the change log (TUTORS)
  int32 actingUserId = 4;
  // Stored in the change log entry
  string reason = 5;
}
message SetProjectTutorsResponse { repeated ProjectTutor tutors = 1; }

message ListPendingParticipantsRequest {  int32 projectId = 1; }
message ListPendingParticipantsResponse {  repeated PendingProjectParticipant items = 1;}

message CreateProjectWithParticipantsRequest {
  int32 eventId = 1;
  string name = 2;
  optional string description = 3;
  optional string eventNumber = 4;
  int32 courseId = 5;
  optional ProjectState state = 6; // Optional - backend defaults to UNDER_REVIEW for public submissions
  repeated PendingParticipantInput participants = 7;
  repeated ProjectDocumentInput documents = 8;
  string eventType = 9;
  optional string projectCode = 10;
  // Existing Tutor/Professor users and tutors typed in by email
  repeated int32 tutorUserIds = 11;
  repeated PendingTutorInput pendingTutors = 12;
  // NRC of the course section, looked up in the term of the event. Required when the event
  // requires a course section; ignored otherwise (the project gets course section 0)
  optional string nrc = 13;
}

message CreateProjectWithParticipantsResponse {
  Project project = 1;
  repeated PendingProjectParticipant participants = 2;
  repeated ProjectDocument documents = 3;
  repeated ProjectTutor tutors = 4;
}

message ListAssignedProjectsRequest {
  JurorKey juror = 1;
  int32 page = 2;             // número de página
  int32 page_size = 3;        // cantidad de ítems por página
}

message ListAssignedProjectsResponse {
  repeated ProjectComplete items = 1; // proyectos asignados al jurado
  int32 total = 2;            // total de proyectos
  int32 page = 3;
  int32 pageSize = 4;
}

message DeleteProjectRequest { int32 id = 1; }
message DeleteProjectResponse { bool ok = 1; }

message ListProjectsForReviewRequest  { 
  int32 eventId = 1;
  optional string q = 2;
  optional int32 currentPage = 3;           // page number (1-indexed)
  optional int32 itemsPerPage = 4;          // items per page
  optional int32 courseId = 5;
  }
message ListProjectsForReviewResponse { 
  repeated ProjectComplete items = 1;
  int32 total = 2;
  int32 currentPage = 3;           // current page number
  int32 itemsOnCurrentPage = 4;
  int32 itemsPerPage = 5;          // items per page
  int32 totalPages = 6;     // total number of pages
  }
  
message UpdateProjectDocumentRequest {
  int32 id = 1;           // ID del documento
  optional string url = 2;         // si viene vacío, no lo cambias
  optional TypedDocument type = 3;  // si viene DOCUMENT_TYPE_UNSPECIFIED, no lo cambias
  optional DocumentStatus state = 4; // igual idea
}

message GetMyProjectByEventRequest {
  int32 eventId = 1;
  int32 userId = 2;
}

message GetMyProjectByEventResponse {
  ProjectComplete project = 1;
}

message ListCourseSectionsRequest {
  int32 eventId = 1;
}

// Professor of a course section; no email, since any signed-in user can list the sections
message CourseSectionProfessor {
  int32 userId = 1;
  string firstName = 2;
  optional string lastName = 3;
}

message CourseSection {
  int32 id = 1;
  string nrc = 2;
  string name = 3;
  // Absent when the professor account no longer exists or auth-service could not be reached
  optional CourseSectionProfessor professor = 4;
}

message ListCourseSectionsResponse {
  repeated CourseSection sections = 1;
  // false when auth-service failed: the sections come back without professor names
  bool professorsAvailable = 2;
}

message ListUserParticipationsRequest {
  int32 userId = 1;
  // Used to match the participant data captured at submission (unique per project)
  string email = 2;
  // Max participations to return, most recent first (default 10, max 50)
  optional int32 limit = 3;
}

// One confirmed participation of a user. career and semester come from the
// participant data captured at submission and may be empty.
message UserParticipation {
  Project project = 1;
  string studentCode = 2;
  optional string career = 3;
  optional string semester = 4;
}

// Academic data derived from all the user's participations: each field takes
// the most recent informative value. Not stored on the user.
message AcademicInfo {
  optional string studentCode = 1;
  optional string career = 2;
  optional string semester = 3;
}

message ListUserParticipationsResponse {
  repeated UserParticipation participations = 1;
  AcademicInfo academic = 2;
  int32 total = 3;
}

/************** Juror import **************/
enum JurorImportOutcome {
  JUROR_IMPORT_OUTCOME_UNSPECIFIED = 0;
  ASSIGN = 1;  // will be assigned on confirm
  SKIP = 2;    // already assigned, nothing to do
  ERROR = 3;   // blocks the confirmation
}

enum JurorImportUserStatus {
  JUROR_IMPORT_USER_STATUS_UNSPECIFIED = 0;  // the email could not be resolved
  NEW_USER = 1;         // no account: one is created and invited on confirm
  EVENT_JUROR = 2;      // already a juror of the event
  INVITE_TO_EVENT = 3;  // has an account but is not in the event: invited on confirm
}

// One juror of one project row of the "Asignación jurados" sheet, as read by the gateway.
// A sheet row holds up to N jurors; each one with any data is sent as its own JurorImportRow.
message JurorImportRow {
  int32 rowNumber = 1;    // spreadsheet row (the first data row is 5)
  string department = 2;
  string projectCode = 3;
  string firstName = 4;   // "Nombre(s) jurado N"
  string email = 5;       // as written; project-service normalizes it
  int32 jurorSlot = 6;    // N of "Nombre(s) jurado N", starting at 1
  string lastName = 7;    // "Apellido(s) jurado N"; optional
}

message PreviewJurorImportRequest {
  int32 eventId = 1;
  repeated JurorImportRow rows = 2;
}

message JurorImportRowResult {
  int32 rowNumber = 1;
  JurorImportOutcome outcome = 2;
  JurorImportUserStatus userStatus = 3;
  string message = 4;     // in Spanish, for the person who uploaded the file
  string email = 5;       // normalized
  optional int32 projectId = 6;
  optional string projectName = 7;
  optional int32 userId = 8;
  int32 jurorSlot = 9;    // same as the row it answers
}

message JurorImportTotals {
  int32 rows = 1;
  int32 toAssign = 2;
  int32 skipped = 3;
  int32 errors = 4;
  int32 jurors = 5;          // distinct jurors in rows to assign
  int32 newUsers = 6;
  int32 invitesToEvent = 7;
}

message PreviewJurorImportResponse {
  repeated JurorImportRowResult rows = 1;
  JurorImportTotals totals = 2;
  repeated string eventWarnings = 3;  // event-level problems; any of them blocks the confirmation
  bool canConfirm = 4;                // no row errors and no event warnings
}

message JurorImportFailedInvitation {
  string email = 1;
  string message = 2;  // in Spanish, why the invitation could not be sent
}

message ExecuteJurorImportRequest {
  int32 eventId = 1;
  repeated JurorImportRow rows = 2;  // the same rows of the preview
  // Jurors whose invitation could not be sent: their rows are reported as errors and not assigned
  repeated JurorImportFailedInvitation failedInvitations = 3;
}

message JurorImportExecutionTotals {
  int32 rows = 1;
  int32 assigned = 2;
  int32 skipped = 3;
  int32 errors = 4;
  int32 jurors = 5;  // distinct jurors in assigned rows
}

message ExecuteJurorImportResponse {
  repeated JurorImportRowResult rows = 1;  // ASSIGN: assigned now, SKIP: already assigned, ERROR: not assigned
  JurorImportExecutionTotals totals = 2;
}

message GetJurorImportTemplateRequest {
  int32 eventId = 1;
}

message JurorImportTemplateProject {
  int32 projectId = 1;
  string department = 2;   // category name; empty if the project has no category of the event
  string projectCode = 3;  // empty if the project has no number yet
  string name = 4;
  repeated string members = 5;  // full names of the participants, confirmed first and then pending
  repeated string tutors = 6;  // full names of the tutors, linked first and then pending
  repeated string tutorEmails = 7;  // emails of those same tutors, in the same order
}

message GetJurorImportTemplateResponse {
  string eventName = 1;
  reserved 2;  // departments
  repeated JurorImportTemplateProject projects = 3;  // approved projects, by department and number
}

// ===== STUDENT DASHBOARD =====
// Statistics and history only count approved projects of events that were not deleted.
// Awards only count once the admin publishes the event results.
// currentProject is the project of an event that has not ended; rejected projects only when there is no other.

message GetStudentParticipationStatsRequest {
  int32 userId = 1;
  // Used to match the participant data captured at submission (academic data)
  string email = 2;
}

message StudentAward {
  int32 awardId = 1;
  string title = 2;
  int32 position = 3;
  string categoryName = 4;
}

message StudentParticipation {
  int32 projectId = 1;
  string projectName = 2;
  int32 eventId = 3;
  string eventName = 4;
  string eventStartDate = 5;
  string eventEndDate = 6;
  // Derived from the event start date (Bogota time): AAAA-10 (January to June) or AAAA-30 (July to December)
  string semester = 7;
  // true when the event already ended (historical); false while it is upcoming or in progress
  bool finished = 8;
  repeated StudentAward awards = 9;
  string projectCode = 10;
  // Category of the project in the event (course)
  string courseName = 11;
  // true when the admin published the event results (scores can be shown)
  bool resultsPublished = 12;
}

message StudentCurrentProject {
  int32 projectId = 1;
  int32 eventId = 2;
  string eventName = 3;
  string eventStartDate = 4;
  string semester = 5;
  string projectCode = 6;
  string name = 7;
  string description = 8;
  string courseName = 9;
  // UNDER_REVIEW, APPROVED, REJECTED or REQUEST_CHANGES
  string state = 10;
  // true only while the event is not over and changes were requested
  bool canEdit = 11;
  int32 participantsCount = 12;
  int32 documentsCount = 13;
  // true when the admin published the event results (scores can be shown)
  bool resultsPublished = 14;
}

message SemesterParticipation {
  string semester = 1;
  int32 events = 2;
  int32 projects = 3;
  int32 awards = 4;
}

message GetStudentParticipationStatsResponse {
  int32 totalEvents = 1;
  int32 finishedEvents = 2;
  int32 ongoingEvents = 3;
  int32 totalProjects = 4;
  int32 totalAwards = 5;
  // Oldest semester first, so it can be drawn as the evolution over time
  repeated SemesterParticipation bySemester = 6;
  // Most recent event first
  repeated StudentParticipation participations = 7;
  // Not set when the student has no project in an event that has not ended
  StudentCurrentProject currentProject = 8;
  // Derived from all the user's participations, as in ListUserParticipations
  AcademicInfo academic = 9;
}

enum ProjectAccessAction {
  PROJECT_ACCESS_ACTION_UNSPECIFIED = 0;
  PROJECT_ACCESS_READ = 1;
  PROJECT_ACCESS_EDIT = 2;
}

message CheckProjectAccessRequest {
  int32 userId = 1;
  ProjectAccessAction action = 2;
  // One of them: the project, or a document of the project
  int32 projectId = 3;
  int32 documentId = 4;
}

message CheckProjectAccessResponse {
  int32 projectId = 1;
}

/************** Academic read endpoints **************/
message ListProjectsInScopeRequest {
  int32 userId = 1;
  optional int32 eventId = 2;
  optional ProjectState state = 3;
  optional int32 academicCourseId = 4;
  optional string q = 5;
  optional int32 currentPage = 6;   // default 1
  optional int32 itemsPerPage = 7;  // default 10, at most 100
}

message GetProjectInScopeRequest {
  int32 userId = 1;
  int32 projectId = 2;
}

message ListEventIdsInScopeRequest { int32 userId = 1; }
message ListEventIdsInScopeResponse { repeated int32 eventIds = 1; }

/************** Administrative change log **************/
message ListProjectChangeLogRequest { int32 projectId = 1; }

message ProjectChangeLogEntry {
  int32 id = 1;
  int32 projectId = 2;
  // auth-service user who made the change
  int32 actorUserId = 3;
  // STATE, INFO, CATEGORY, PARTICIPANTS, TUTORS or DOCUMENTS
  string action = 4;
  // JSON object with the changed fields only, before and after the change
  string beforeJson = 5;
  string afterJson = 6;
  optional string reason = 7;
  // ISO 8601
  string createdAt = 8;
}

message ListProjectChangeLogResponse { repeated ProjectChangeLogEntry entries = 1; }

/************** Administrative state change **************/
message AdminChangeProjectStateRequest {
  int32 id = 1;
  // auth-service user making the change
  int32 actingUserId = 2;
  ProjectState state = 3;
  string reason = 4;
  // true: the participants get the email of the new state (none for UNDER_REVIEW)
  bool notify = 5;
  // true: change it even if the project has evaluations or the event has published results
  bool force = 6;
}

// Why the change needs force; at least one of hasEvaluations or resultsPublished is true
message ProjectStateChangeBlock {
  bool hasEvaluations = 1;
  int32 evaluationCount = 2;
  bool resultsPublished = 3;
  // true when the project is APPROVED and would leave the ranking and the juror import
  bool leavesApproved = 4;
  // Spanish message for the user
  string message = 5;
}

// Exactly one of project (changed) or blocked (nothing changed) is set
message AdminChangeProjectStateResponse {
  optional Project project = 1;
  optional ProjectStateChangeBlock blocked = 2;
  // Work in other services that failed after the change was saved: TUTOR_ACTIVATION, NOTIFICATION
  repeated string failedEffects = 3;
  // Spanish warning for failedEffects; empty when nothing failed
  string warning = 4;
}

/************** Administrative edit of basic data and category **************/
// Only the fields that are set are edited; an empty string clears description, projectCode and eventNumber
message AdminUpdateProjectRequest {
  int32 id = 1;
  // auth-service user making the change
  int32 actingUserId = 2;
  optional string name = 3;
  optional string description = 4;
  optional string projectCode = 5;
  optional string eventNumber = 6;
  // A category (course) of the project's event
  optional int32 courseId = 7;
  // Stored in the change log entries
  string reason = 8;
  // true: change the category even if the project has juror evaluations
  bool force = 9;
}

// Why nothing changed
message AdminProjectEditConflict {
  // PROJECT_NAME_TAKEN: another project of the event has that name
  // PROJECT_CATEGORY_CHANGE_BLOCKED: the project has juror evaluations; resend with force
  // PROJECT_CHANGED_MEANWHILE: another edit changed the same fields first; reload and retry
  string code = 1;
  // Spanish message for the user
  string message = 2;
  // PROJECT_CATEGORY_CHANGE_BLOCKED: juror evaluations of the project
  int32 evaluationCount = 3;
  // PROJECT_NAME_TAKEN: the name that is taken
  string name = 4;
}

// Exactly one of project (edited, or unchanged when no field differed) or conflict (nothing changed) is set
message AdminUpdateProjectResponse {
  optional Project project = 1;
  optional AdminProjectEditConflict conflict = 2;
}

/************** Administrative participants **************/
message AdminPendingParticipantInput {
  string firstName = 1;
  optional string lastName = 2;
  string email = 3;
  string studentCode = 4;
  string semester = 5;
  string career = 6;
}

// Exactly one of userId (enrolled, with studentCode) or pending is set
message AdminAddParticipantRequest {
  int32 projectId = 1;
  // auth-service user making the change
  int32 actingUserId = 2;
  optional int32 userId = 3;
  optional string studentCode = 4;
  optional AdminPendingParticipantInput pending = 5;
  // Stored in the change log entry
  string reason = 6;
}

// Why nothing changed
message AdminParticipantsRejection {
  // PARTICIPANT_HAS_ACTIVE_PROJECT: the student is in another active project of the event (projectId)
  // PARTICIPANT_ALREADY_IN_PROJECT: the student is already a participant of this project
  // LAST_PARTICIPANT: the project would be left without participants
  string code = 1;
  // Spanish message for the user
  string message = 2;
  optional string email = 3;
  optional int32 projectId = 4;
  optional int32 userId = 5;
}

// Exactly one of participant, pendingParticipant (added) or rejected (nothing changed) is set
message AdminAddParticipantResponse {
  optional ProjectParticipant participant = 1;
  optional PendingProjectParticipant pendingParticipant = 2;
  optional AdminParticipantsRejection rejected = 3;
  // Work in other services that failed after the participant was saved: NOTIFICATION
  repeated string failedEffects = 4;
  // Spanish warning for failedEffects; empty when nothing failed
  string warning = 5;
}

// Exactly one of userId or pendingId is set
message AdminRemoveParticipantRequest {
  int32 projectId = 1;
  // auth-service user making the change
  int32 actingUserId = 2;
  optional int32 userId = 3;
  optional int32 pendingId = 4;
  // Stored in the change log entry
  string reason = 5;
}

// rejected is set when nothing changed
message AdminRemoveParticipantResponse {
  optional AdminParticipantsRejection rejected = 1;
}
