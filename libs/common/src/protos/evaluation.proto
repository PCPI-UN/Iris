syntax = "proto3";

package evaluation;

// ===== EVALUATION SERVICE =====
service EvaluationService {
  rpc EvaluateProject(EvaluateProjectRequest) returns (EvaluationProto);
  rpc FindEvaluationById(FindEvaluationByIdRequest) returns (EvaluationProto);
  rpc FindEvaluationsByEvaluator(FindEvaluationsByEvaluatorRequest) returns (FindEvaluationsByEvaluatorResponse);
  rpc GetProjectStats(GetProjectStatsRequest) returns (GetProjectStatsResponse);
  // Consolidated result of a project for its participants: no juror ids nor juror count
  rpc GetProjectResult(GetProjectResultRequest) returns (GetProjectResultResponse);
  rpc CheckEvaluationStatus(CheckEvaluationStatusRequest) returns (CheckEvaluationStatusResponse);
  rpc GetTopProjectsByCourse(GetTopProjectsByCourseRequest) returns (GetTopProjectsByCourseResponse);
  rpc GetDashboardStats(GetEvaluationDashboardStatsRequest) returns (GetEvaluationDashboardStatsResponse);

}

// ===== CRITERIONS SERVICE =====
service CriterionsService {
  // Creates a new criterion
  rpc CreateCriterion (CreateCriterionRequest) returns (CriterionProto) {}

  // Updates an existing criterion
  rpc UpdateCriterion (UpdateCriterionRequest) returns (CriterionProto) {}

  // Gets a criterion by ID
  rpc GetCriterion (GetCriterionRequest) returns (CriterionProto) {}

  // Lists criterions with optional filters
  rpc ListCriterions (ListCriterionsRequest) returns (ListCriterionsResponse) {}

  // Lists criterions by course
  rpc FindCriterionsByCourse(FindCriterionsByCourseRequest) returns (FindCriterionsByCourseResponse) {}

  // Deletes a criterion
  rpc DeleteCriterion (DeleteCriterionRequest) returns (DeleteCriterionResponse) {}

  // Component CRUD operations
  rpc CreateComponent (CreateComponentRequest) returns (ComponentProto) {}
  rpc GetComponent (GetComponentRequest) returns (ComponentProto) {}
  rpc ListComponents (Empty) returns (ListComponentsResponse) {}
  rpc UpdateComponent (UpdateComponentRequest) returns (ComponentProto) {}
  rpc DeleteComponent (DeleteComponentRequest) returns (DeleteCriterionResponse) {}

  // Tells, per category, whether the rubric of an event can be evaluated
  rpc GetRubricReadiness (GetRubricReadinessRequest) returns (GetRubricReadinessResponse) {}
}

// ===== COMMON MESSAGES =====

message PaginationMetadata {
  int32 total = 1;
  int32 itemsOnCurrentPage = 2;
  int32 itemsPerPage = 3;
  int32 currentPage = 4;
  int32 totalPages = 5;
}

// Criterion response type
message CriterionProto {
  int32 id = 1;
  int32 eventId = 2;
  string name = 3;
  optional string description = 4;
  double weight = 5;
  bool active = 6;
  repeated int32 courseIds = 7;
  optional string category = 8;
  optional ComponentProto component = 9;
}

message EvaluationProto {
  int32 id = 1;
  int32 projectId = 2;
  int32 userId = 3;
  int32 eventId = 4;
  double grade = 6;
  optional string comments = 7;
  string date = 8;
  repeated EvaluationDetailResponse scores = 9;
}

// ===== EVALUATION MESSAGES =====

message EvaluationScore {
  int32 criterionId = 1;
  int32 score = 2;
}

message EvaluateProjectRequest {
  int32 projectId = 1;
  int32 userId = 2;
  optional string comments = 3;
  repeated EvaluationScore scores = 4;
}

message FindEvaluationByIdRequest {
  int32 id = 1;
}

message FindEvaluationsByEvaluatorRequest {
  int32 userId = 1;
  int32 eventId = 2;
  optional int32 page = 3;
  optional int32 limit = 4;
}

message FindEvaluationsByEvaluatorResponse {
  repeated EvaluationProto evaluations = 1;
  PaginationMetadata meta = 2;
}

message GetProjectStatsRequest {
  int32 projectId = 1;
}

message CategoryStatsResponse {
  string category = 1;
  double averageScore = 2;
  double weight = 3;
}

message GetProjectStatsResponse {
  int32 projectId = 1;
  double averageGrade = 2;
  int32 evaluationCount = 3;
  repeated CategoryStatsResponse categoryStats = 4;
  repeated int32 evaluatorIds = 5;
}

message GetProjectResultRequest {
  int32 projectId = 1;
}

message CriterionResultProto {
  int32 criterionId = 1;
  string criterion = 2;
  string component = 3;
  // Effective weight of the criterion in the grade (fraction, 0-1)
  double weight = 4;
  // Average of the jurors' stored scores
  double score = 5;
}

message GetProjectResultResponse {
  // false when no juror has evaluated the project yet; the other fields are then empty
  bool evaluated = 1;
  // Average of the jurors' grades, rounded as the ranking does
  double finalScore = 2;
  // Highest grade possible with the event's evaluation type
  double maxScore = 3;
  repeated CriterionResultProto criteria = 4;
  // The jurors' comments in one text, without saying who wrote each one
  string consolidatedFeedback = 5;
}

message CheckEvaluationStatusRequest {
  int32 userId = 1;
  int32 eventId = 2;
  repeated int32 projectIds = 3;
}

message ProjectEvaluationStatus {
  int32 projectId = 1;
  bool evaluated = 2;
  optional EvaluationProto evaluation = 3;
}

message CheckEvaluationStatusResponse {
  repeated ProjectEvaluationStatus projects = 1;
}

message EvaluationDetailResponse {
  int32 evaluationId = 1;
  int32 criterionId = 2;
  double score = 3;
  // Effective weight the criterion had in the grade when it was evaluated
  optional double weight = 4;
}

// ===== CRITERIONS MESSAGES =====


// The request message for getting criterions of a course
message FindCriterionsByCourseRequest {
  int32 courseId = 1;
}

// Simplified criterion info for category grouping
message CriterionSummary {
  int32 id = 1;
  string name = 2;
}

message CriterionCategoryProto {
  string category = 1;
  double weight = 2;
  repeated CriterionSummary criterions = 3;
}

// The response message for getting criterions of a course
message FindCriterionsByCourseResponse {
  repeated CriterionCategoryProto categories = 1; 
}

// The request message for creating a new criterion.
message CreateCriterionRequest {
  int32 eventId = 1;
  string name = 2;
  optional string description = 3;
  // Relative weight inside its component and category; 1 when not sent
  optional double weight = 4;
  repeated int32 courseIds = 5;
  optional string category = 6;
  optional int32 componentId = 7;
}

// The request message for updating a criterion.
message UpdateCriterionRequest {
  int32 id = 1;
  optional int32 eventId = 2;
  optional string name = 3;
  optional string description = 4;
  optional double weight = 5;
  optional bool active = 6;
  repeated int32 courseIds = 7;
  optional string category = 8;
  optional int32 componentId = 9;
}

// The request message for getting a criterion by ID.
message GetCriterionRequest {
  int32 id = 1;
}

// The request message for listing criterions.
message ListCriterionsRequest {
  optional int32 eventId = 1;    
  optional int32 courseId = 2;   
  optional int32 limit = 3;
  optional int32 page = 4;
}

// The response message containing the list of criterions.
message ListCriterionsResponse {
  repeated CriterionProto criterions = 1;
  PaginationMetadata meta = 2;
}

// The request message for deleting a criterion.
message DeleteCriterionRequest {
  int32 id = 1;
}

// The response message for deleting a criterion.
message DeleteCriterionResponse {
  bool success = 1;
  string message = 2;
}

// ===== TOP PROJECTS BY PROJECT IDS =====

message GetTopProjectsByCourseRequest {
  repeated int32 projectIds = 1;
}

message TopProjectProto {
  int32 projectId = 1;
  double averageGrade = 2;
  int32 evaluationCount = 3;
}

message GetTopProjectsByCourseResponse {
  repeated TopProjectProto topProjects = 1;
}

// ===== COMPONENT MESSAGES =====

message ComponentProto {
  int32 id = 1;
  string name = 2;
  double weight = 3;
  optional int32 eventId = 4;
}

message CreateComponentRequest {
  string name = 1;
  // Fraction of the grade (0-1); the components of an event add up to 1
  double weight = 2;
  int32 eventId = 3;
}

message GetComponentRequest {
  int32 id = 1;
}

message ListComponentsResponse {
  repeated ComponentProto components = 1;
}

message GetRubricReadinessRequest {
  int32 eventId = 1;
  // When set, the response only includes this category (course)
  optional int32 courseId = 2;
}

message RubricCategoryReadiness {
  int32 courseId = 1;
  bool ready = 2;
  int32 criteriaCount = 3;
  // Components of the event without any criterion in this category
  repeated int32 missingComponentIds = 4;
  // Criteria of this category that are not inside a component of the event
  repeated int32 criteriaWithoutComponent = 5;
}

message GetRubricReadinessResponse {
  int32 eventId = 1;
  // Sum of the component weights of the event; must be 1 to evaluate
  double componentsWeight = 2;
  repeated ComponentProto components = 3;
  repeated RubricCategoryReadiness categories = 4;
}

message UpdateComponentRequest {
  int32 id = 1;
  optional string name = 2;
  optional double weight = 3;
}

message DeleteComponentRequest {
  int32 id = 1;
}

message Empty {}

message GetEvaluationDashboardStatsRequest {}

message GetEvaluationDashboardStatsResponse {
  int32 evaluations = 1;
}

// ===== TIEBREAK SERVICE =====

service TieBreakService {
  rpc CreateTieBreak (CreateTieBreakRequest) returns (TieBreakProto) {}
  rpc GetTieBreak (GetTieBreakRequest) returns (TieBreakProto) {}
  rpc ListTieBreaks (ListTieBreaksRequest) returns (ListTieBreaksResponse) {}
  rpc UpdateTieBreak (UpdateTieBreakRequest) returns (TieBreakProto) {}
  rpc DeleteTieBreak (DeleteTieBreakRequest) returns (DeleteTieBreakResponse) {}
}

message TieBreakProto {
  int32 id = 1;
  int32 projectId = 2;
  int32 eventId = 3;
  int32 categoryId = 4;
  int32 tiebreakOrder = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

message CreateTieBreakRequest {
  int32 projectId = 1;
  int32 eventId = 2;
  int32 categoryId = 3;
  int32 tiebreakOrder = 4;
}

message GetTieBreakRequest {
  int32 id = 1;
}

message ListTieBreaksRequest {
  optional int32 eventId = 1;
  optional int32 categoryId = 2;
  optional int32 projectId = 3;
}

message ListTieBreaksResponse {
  repeated TieBreakProto tiebreaks = 1;
}

message UpdateTieBreakRequest {
  int32 id = 1;
  optional int32 tiebreakOrder = 2;
  optional int32 projectId = 3;
  optional int32 categoryId = 4;
}

message DeleteTieBreakRequest {
  int32 id = 1;
}

message DeleteTieBreakResponse {
  bool success = 1;
  string message = 2;
}
