syntax = "proto3";

package invitation;

// Invitation Service definition
service InvitationService {
  // Creates a new invitation
  rpc CreateInvitation (CreateInvitationRequest) returns (Invitation) {}
  // Gets an invitation by token
  rpc GetInvitationByToken (GetInvitationByTokenRequest) returns (GetInvitationByTokenResponse) {}
  // Accepts an invitation
  rpc AcceptInvitation (AcceptInvitationRequest) returns (AcceptInvitationResponse) {}
  // Rejects an invitation
  rpc RejectInvitation (RejectInvitationRequest) returns (RejectInvitationResponse) {}
  // Finds a pending invitation by email and target type
  rpc FindPendingByEmail (FindPendingByEmailRequest) returns (FindPendingByEmailResponse) {}
  // Lists jurors invited to an event
  rpc GetEventInvitations (GetEventInvitationsRequest) returns (GetEventInvitationsResponse) {}
  // Resends an expired invitation
  rpc ResendInvitation (ResendInvitationRequest) returns (ResendInvitationResponse) {}
  // Lists invitations for a user
  rpc GetUserInvitations (GetUserInvitationsRequest) returns (GetUserInvitationsResponse) {}
}

// ---- INVITATION MODULE REQUEST/RESPONSE ----

message PaginationMetadata {
  int32 total = 1;
  int32 itemsOnCurrentPage = 2;
  int32 itemsPerPage = 3;
  int32 currentPage = 4;
  int32 totalPages = 5;
}

// The request message for creating a new invitation
message CreateInvitationRequest {
  string email = 1;
  string targetType = 2;
  int32 targetId = 3;
  int32 invitedByUserId = 5;
  repeated int32 roleIds = 6;
  optional string firstName = 7;
  optional string lastName = 8;
  string eventType = 9;
}

// The request message for getting an invitation by token
message GetInvitationByTokenRequest {
  string token = 1;
}

// The response message for getting an invitation by token
message GetInvitationByTokenResponse {
  string email = 1;
  string userStatus = 2; // Will be "PENDING" or "CONFIRMED"
  optional string firstName = 3;
  optional string lastName = 4;
  repeated int32 roleIds = 5;
}

// The request message for accepting an invitation
message AcceptInvitationRequest {
  string token = 1;
  optional string password = 2; // For new users setting their password
  optional string firstName = 3;
  optional string lastName = 4;
  optional string studentCode = 5; // For project invitations - student code
  optional string microsoftToken = 6;
}

// The response message for accepting an invitation
message AcceptInvitationResponse {
  bool success = 1;
}

// The request message for rejecting an invitation
message RejectInvitationRequest {
  string token = 1;
}

// The response message for rejecting an invitation
message RejectInvitationResponse {
  bool success = 1;
}

// The request message for finding a pending invitation by email
message FindPendingByEmailRequest {
  string email = 1;
  string targetType = 2; // "PLATFORM", "EVENT", or "PROJECT"
  int32 targetId = 3;
}

// The response message for finding a pending invitation by email
message FindPendingByEmailResponse {
  optional Invitation invitation = 1; // Returns invitation if found, null if not
}

message GetEventInvitationsRequest {
  int32 eventId = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
  optional int32 roleId = 4;
}

message GetEventInvitationsResponse {
  repeated Invitation invitations = 1;
  PaginationMetadata meta = 2;
}

message ResendInvitationRequest {
  string invitationId = 1;
}

message ResendInvitationResponse {
  bool success = 1;
}

message GetUserInvitationsRequest {
  int32 userId = 1;
  optional string status = 2; // Optional filter by status
  optional int32 page = 3;
  optional int32 limit = 4;
}

message GetUserInvitationsResponse {
  repeated Invitation invitations = 1;
  PaginationMetadata meta = 2;
}

enum InvitationStatus {
  PENDING = 0;
  EXPIRED = 1;
  REJECTED = 2;
  ACCEPTED = 3;
}

enum InvitationTargetType {
  EVENT = 0;
  PLATFORM = 1;
  PROJECT = 2;
  PROJECT_TUTOR = 3;
}

// The invitation message
message Invitation {
  string id = 1;
  string token = 2;
  string email = 3;
  InvitationTargetType targetType = 4;
  int32 targetId = 5;
  InvitationStatus status = 6;
  string expiresAt = 7;
  int32 invitedByUserId = 8;
  int32 invitedUserId = 9;
  repeated int32 roleIds = 10;
  string createdAt = 11;
}