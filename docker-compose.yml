services:
  # PostgreSQL Database - Single instance with multiple databases
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Pass individual database passwords to init script
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EVALUATION_DB_PASSWORD: ${EVALUATION_DB_PASSWORD}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      INVITATION_DB_PASSWORD: ${INVITATION_DB_PASSWORD}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================================================================
  # AUTH SERVICE - Migration + Application
  # ==================================================================

  auth-migration:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_service
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    command: >
      sh -c "prisma migrate deploy --schema=./apps/auth-service/prisma/schema.prisma &&
             node dist/apps/auth-service/prisma/seed.js"
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_service
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50051}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_REFRESH_PRIVATE_KEY=${JWT_REFRESH_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_REFRESH_PUBLIC_KEY=${JWT_REFRESH_PUBLIC_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - PASSWORD_RESET_TOKEN_EXPIRY_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      auth-migration:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50051}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # EVALUATION SERVICE - Migration + Application
  # ==================================================================

  evaluation-migration:
    build:
      context: .
      dockerfile: apps/evaluation-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://evaluation_user:${EVALUATION_DB_PASSWORD}@postgres:5432/evaluation_service
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/evaluation-service/prisma/schema.prisma
    restart: "no"

  evaluation-service:
    build:
      context: .
      dockerfile: apps/evaluation-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://evaluation_user:${EVALUATION_DB_PASSWORD}@postgres:5432/evaluation_service
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service:50051}
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service:50053}
      - PROJECT_SERVICE_URL=${PROJECT_SERVICE_URL:-project-service:50055}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50052}
    depends_on:
      postgres:
        condition: service_healthy
      evaluation-migration:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50052}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # EVENT SERVICE - Migration + Application
  # ==================================================================

  event-migration:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://event_user:${EVENT_DB_PASSWORD}@postgres:5432/event_service
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/event-service/prisma/schema.prisma
    restart: "no"

  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://event_user:${EVENT_DB_PASSWORD}@postgres:5432/event_service
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service:50051}
      - PROJECT_SERVICE_URL=${PROJECT_SERVICE_URL:-project-service:50055}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50053}
    depends_on:
      postgres:
        condition: service_healthy
      event-migration:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50053}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # INVITATION SERVICE - Migration + Application
  # ==================================================================

  invitation-migration:
    build:
      context: .
      dockerfile: apps/invitation-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://invitation_user:${INVITATION_DB_PASSWORD}@postgres:5432/invitation_service
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/invitation-service/prisma/schema.prisma
    restart: "no"

  invitation-service:
    build:
      context: .
      dockerfile: apps/invitation-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://invitation_user:${INVITATION_DB_PASSWORD}@postgres:5432/invitation_service
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50054}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service:50051}
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service:50053}
      - PROJECT_SERVICE_URL=${PROJECT_SERVICE_URL:-project-service:50055}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-notification-service:50056}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      invitation-migration:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50054}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # PROJECT SERVICE - Migration + Application
  # ==================================================================

  project-migration:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://project_user:${PROJECT_DB_PASSWORD}@postgres:5432/project_service
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/project-service/prisma/schema.prisma
    restart: "no"

  project-service:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://project_user:${PROJECT_DB_PASSWORD}@postgres:5432/project_service
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service:50051}
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service:50053}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-notification-service:50056}
      - INVITATION_SERVICE_URL=${INVITATION_SERVICE_URL:-invitation-service:50054}
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50055}
    depends_on:
      postgres:
        condition: service_healthy
      project-migration:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50055}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # GATEWAY
  # ==================================================================
   
   ## NOTE: We are commenting the gateway in production because of a problem with
   ## dockploy. We are deploying the gateway as a separate service from the ones here
   ## in the compose. However, they all have access to each other through the same network!
   
  gateway:
     build:
       context: .
       dockerfile: apps/gateway/Dockerfile
       target: production
     environment:
       - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-auth-service:50051}
       - EVALUATION_SERVICE_URL=${EVALUATION_SERVICE_URL:-evaluation-service:50052}
       - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-event-service:50053}
       - INVITATION_SERVICE_URL=${INVITATION_SERVICE_URL:-invitation-service:50054}
       - PROJECT_SERVICE_URL=${PROJECT_SERVICE_URL:-project-service:50055}
       - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-notification-service:50056}
       - NODE_ENV=${NODE_ENV:-production}
       - ALLOW_INSECURE_COOKIES=${ALLOW_INSECURE_COOKIES:-false}
       - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
       - COOKIE_DOMAIN=${COOKIE_DOMAIN}
       - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
       - JWT_REFRESH_PUBLIC_KEY=${JWT_REFRESH_PUBLIC_KEY}
       - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
       - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
       - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
       - AZURE_BLOB_SAS_URL=${AZURE_BLOB_SAS_URL}
       - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME}
       - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY}
       - AZURE_CONTAINER=${AZURE_CONTAINER}
       - AZURE_TENANT_ID=${AZURE_TENANT_ID}
       - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
       - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
       - REDIRECT_URI=${REDIRECT_URI}
       - REDIS_HOST=redis
       - REDIS_PORT=6379
       - REDIS_PASSWORD=${REDIS_PASSWORD}
     expose:
       - 3000
     restart: always
     depends_on:
       auth-service:
         condition: service_healthy
       evaluation-service:
         condition: service_healthy
       event-service:
         condition: service_healthy
       invitation-service:
         condition: service_healthy
       project-service:
         condition: service_healthy
       notification-service:
         condition: service_healthy
       redis:
         condition: service_healthy
     networks:
       - dokploy-network
     healthcheck:
       test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 40s

  # ==================================================================
  # NOTIFICATION SERVICE - Migration + Application
  # ==================================================================

  notification-migration:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_service
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    command: prisma migrate deploy --schema=./apps/notification-service/prisma/schema.prisma
    restart: "no"

  notification-service:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_service
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50056}
      - EMAIL_PROVIDERS=${EMAIL_PROVIDERS:-acs,emailjs}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS:-5}
      - EMAIL_RETRY_BASE_DELAY_MS=${EMAIL_RETRY_BASE_DELAY_MS:-60000}
      - EMAIL_RETRY_POLL_MS=${EMAIL_RETRY_POLL_MS:-15000}
      - EMAIL_RETRY_BATCH_SIZE=${EMAIL_RETRY_BATCH_SIZE:-20}
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID}
      - EMAILJS_TEMPLATE_ID=${EMAILJS_TEMPLATE_ID}
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY}
      - EMAILJS_PRIVATE_KEY=${EMAILJS_PRIVATE_KEY}
      - ACS_CONNECTION_STRING=${ACS_CONNECTION_STRING}
      - ACS_SENDER_ADDRESS=${ACS_SENDER_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
      notification-migration:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:50056}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # REDIS
  # ==================================================================

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
    name: iris-postgres-data
  redis_data:
    name: iris-redis-data
