name: Backend CD

on:
  push:
    branches: ['dev', 'prod']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch target (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
      service:
        description: 'Service to deploy (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth-service
          - evaluation-service
          - event-service
          - invitation-service
          - project-service
          - notification-service
          - gateway

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes & Target
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.resolve-services.outputs.services }}
      branch: ${{ steps.resolve-branch.outputs.branch }}

    steps:
      - name: Resolve target branch
        id: resolve-branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.target_branch || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="$REF_NAME"
          fi
          echo "Target branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-branch.outputs.branch }}
          fetch-depth: 0

      - name: Detect changed services
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: .github/service-filters.yml

      - name: Resolve services to deploy
        id: resolve-services
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service || 'all' }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared || 'false' }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          ALL_SERVICES='["auth-service","evaluation-service","event-service","invitation-service","project-service","notification-service","gateway"]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SERVICE" = "all" ]; then
              SERVICES="$ALL_SERVICES"
            else
              SERVICES=$(jq -cn --arg s "$INPUT_SERVICE" '[$s]')
            fi
          elif [ "$SHARED_CHANGED" = "true" ]; then
            SERVICES="$ALL_SERVICES"
          else
            SERVICES=$(echo "$FILTER_CHANGES" | jq -c '[.[] | select(. != "shared")]')
          fi

          echo "Services to deploy: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  deploy-services:
    name: Deploy
    runs-on: ubuntu-24.04-arm
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.branch }}
          fetch-depth: 1

      - name: Creation of the SHA tag
        uses: docker/metadata-action@v5
        id: sha-tag
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          tags: type=sha,prefix=sha-,suffix=-${{ matrix.service }}

      - name: Separation of image and tag
        id: image_tag
        env:
          IMAGE_AND_TAG: ${{ steps.sha-tag.outputs.tags }}
        run: |
          IMAGE="${IMAGE_AND_TAG%%:*}"
          TAG="${IMAGE_AND_TAG##*:}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Load Coolify configuration
        id: coolify-config
        env:
          BRANCH: ${{ needs.detect-changes.outputs.branch }}
          SERVICE: ${{ matrix.service }}
          COOLIFY_URLS_TOKENS_JSON: ${{ secrets.COOLIFY_URLS_TOKENS_JSON }}
          COOLIFY_WEBHOOKS_JSON: ${{ secrets.COOLIFY_WEBHOOKS_JSON }}
        run: |
          COOLIFY_URL=$(echo "$COOLIFY_URLS_TOKENS_JSON" | jq -r --arg b "$BRANCH" '.[$b].url // empty')
          COOLIFY_TOKEN=$(echo "$COOLIFY_URLS_TOKENS_JSON" | jq -r --arg b "$BRANCH" '.[$b].token // empty')

          WEBHOOK_APP_URL=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r --arg b "$BRANCH" --arg s "$SERVICE" '.[$b][$s].webhook_app_url // empty')
          APP_UUID=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r --arg b "$BRANCH" --arg s "$SERVICE" '.[$b][$s].app_uuid // empty')
          WEBHOOK_MIGRATION_URL=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r --arg b "$BRANCH" --arg s "$SERVICE" '.[$b][$s].webhook_migration_url // empty')
          MIGRATION_UUID=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r --arg b "$BRANCH" --arg s "$SERVICE" '.[$b][$s].migration_uuid // empty')

          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "::add-mask::$COOLIFY_TOKEN"
          fi

          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Falta configuración de Coolify (url/token) para la rama '$BRANCH' en COOLIFY_URLS_TOKENS_JSON."
            exit 1
          fi

          if [ -z "$APP_UUID" ] || [ -z "$WEBHOOK_APP_URL" ]; then
            echo "::error::Falta app_uuid o webhook_app_url para '$BRANCH/$SERVICE' en COOLIFY_WEBHOOKS_JSON."
            exit 1
          fi

          {
            echo "COOLIFY_URL=$COOLIFY_URL"
            echo "COOLIFY_TOKEN=$COOLIFY_TOKEN"
            echo "APP_UUID=$APP_UUID"
            echo "WEBHOOK_APP_URL=$WEBHOOK_APP_URL"
            echo "MIGRATION_UUID=$MIGRATION_UUID"
            echo "WEBHOOK_MIGRATION_URL=$WEBHOOK_MIGRATION_URL"
          } >> "$GITHUB_ENV"

          if [ -n "$MIGRATION_UUID" ] && [ -n "$WEBHOOK_MIGRATION_URL" ]; then
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          tags: ${{ steps.sha-tag.outputs.tags }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # --- Pasos de Migración (automáticos cuando migration_uuid y webhook_migration_url están configurados) ---

      - name: Set Coolify Migration Tag
        if: ${{ steps.coolify-config.outputs.has_migration == 'true' }}
        env:
          IMAGE: ${{ steps.image_tag.outputs.image }}
          TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          PAYLOAD=$(jq -cn --arg image "$IMAGE" --arg tag "$TAG" '{docker_registry_image_name: $image, docker_registry_image_tag: $tag}')
          curl -sS -f "https://${COOLIFY_URL}/api/v1/applications/${MIGRATION_UUID}" \
            --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"

      - name: Redeploy Coolify Migration Image
        if: ${{ steps.coolify-config.outputs.has_migration == 'true' }}
        id: redeploy-and-deploymentID
        run: |
          RESPONSE=$(curl -sS -f \
            --request GET "${WEBHOOK_MIGRATION_URL}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}")

          echo "$RESPONSE"
          DEPLOYMENT_UUID=$(echo "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // empty')

          if [ -z "$DEPLOYMENT_UUID" ]; then
            echo "::error::Coolify no devolvió deployment_uuid para la migración."
            exit 1
          fi

          echo "deployment_uuid=$DEPLOYMENT_UUID" >> "$GITHUB_OUTPUT"

      - name: Check redeployment status of Coolify Migration Image
        if: ${{ steps.coolify-config.outputs.has_migration == 'true' }}
        id: check-status-deployment
        timeout-minutes: 10
        env:
          DEPLOYMENT_UUID: ${{ steps.redeploy-and-deploymentID.outputs.deployment_uuid }}
        run: |
          while true; do
            STATUS=$(curl -sS -f \
              "https://${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" | jq -r '.status // empty')

            echo "Estado actual de la migración: $STATUS"
            case "$STATUS" in
              finished)
                echo "Migración completada con éxito."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "::error::La migración terminó con estado '$STATUS' en Coolify."
                exit 1
                ;;
            esac

            sleep 5
          done

      # --- Pasos de Despliegue de la Aplicación (para todos los servicios) ---

      - name: Set Coolify Application Tag
        env:
          IMAGE: ${{ steps.image_tag.outputs.image }}
          TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          PAYLOAD=$(jq -cn --arg image "$IMAGE" --arg tag "$TAG" '{docker_registry_image_name: $image, docker_registry_image_tag: $tag}')
          curl -sS -f "https://${COOLIFY_URL}/api/v1/applications/${APP_UUID}" \
            --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"

      - name: Redeploy Coolify Application Image
        run: |
          curl -sS -f --request GET "${WEBHOOK_APP_URL}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}"
