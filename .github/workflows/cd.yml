name: Docker Image CI

on:
  push:
    branches: ['dev', 'prod']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch target (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.ref_name || inputs.target_branch }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes & Config
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      coolify-url: ${{ steps.obtain-coolify-url-token.outputs.coolify_url }}
      coolify-token: ${{ steps.obtain-coolify-url-token.outputs.coolify_token }}
      branch: ${{ steps.obtain-coolify-url-token.outputs.branch }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtain boolean about changed file
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            auth-service:
              - 'apps/auth-service/**'
            evaluation-service:
              - 'apps/evaluation-service/**'
            event-service:
              - 'apps/event-service/**'
            invitation-service:
              - 'apps/invitation-service/**'
            project-service:
              - 'apps/project-service/**'
            notification-service:
              - 'apps/notification-service/**'
            gateway:
              - 'apps/gateway/**'

      - name: Obtain Coolify Url and Token
        id: obtain-coolify-url-token
        run: |
          BRANCH="${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}"
          echo "branch: $BRANCH"
          COOLIFY_URL=$(echo "$COOLIFY_URLS_TOKENS_JSON" | jq -r ".\"$BRANCH\".url")
          COOLIFY_TOKEN=$(echo "$COOLIFY_URLS_TOKENS_JSON" | jq -r ".\"$BRANCH\".token")

          echo "coolify_url=$COOLIFY_URL" >> $GITHUB_OUTPUT
          echo "coolify_token=$COOLIFY_TOKEN" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

        env:
          COOLIFY_URLS_TOKENS_JSON: ${{ secrets.COOLIFY_URLS_TOKENS_JSON }}

  deploy-services:
    runs-on: ubuntu-24.04-arm
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Creation of the SHA tag
        uses: docker/metadata-action@v5
        id: sha-tag
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          tags: type=sha,prefix=sha-,suffix=-${{ matrix.service }}

      - name: Separation of image and tag
        id: image_tag
        run: |
          IMAGE_AND_TAG="${{ steps.sha-tag.outputs.tags }}"
          IMAGE="${IMAGE_AND_TAG%%:*}"
          TAG="${IMAGE_AND_TAG##*:}"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Post dynamic env values
        id: dynamic-env
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          SERVICE="${{ matrix.service }}"

          WEBHOOK_APP_URL=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r ".\"$BRANCH\".\"$SERVICE\".webhook_app_url // empty")
          APP_UUID=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r ".\"$BRANCH\".\"$SERVICE\".app_uuid // empty")
          WEBHOOK_MIGRATION_URL=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r ".\"$BRANCH\".\"$SERVICE\".webhook_migration_url // empty")
          MIGRATION_UUID=$(echo "$COOLIFY_WEBHOOKS_JSON" | jq -r ".\"$BRANCH\".\"$SERVICE\".migration_uuid // empty")

          echo "webhook_app_url=$WEBHOOK_APP_URL" >> $GITHUB_OUTPUT
          echo "app_uuid=$APP_UUID" >> $GITHUB_OUTPUT
          echo "webhook_migration_url=$WEBHOOK_MIGRATION_URL" >> $GITHUB_OUTPUT
          echo "migration_uuid=$MIGRATION_UUID" >> $GITHUB_OUTPUT
        env:
          COOLIFY_WEBHOOKS_JSON: ${{ secrets.COOLIFY_WEBHOOKS_JSON }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          tags: ${{ steps.sha-tag.outputs.tags }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Pasos de Migración (solo para servicios con BD: no gateway ni notification-service) ---

      - name: Set Coolify Migration Tag
        if: ${{ matrix.service != 'notification-service' && matrix.service != 'gateway' }}
        run: |
          curl -f "https://${{ needs.detect-changes.outputs.coolify-url }}/api/v1/applications/${{ steps.dynamic-env.outputs.migration_uuid }}" \
          --request PATCH \
          --header "Authorization: Bearer ${{ needs.detect-changes.outputs.coolify-token }}" \
          --header "Content-Type: application/json" \
          --data "{
            \"docker_registry_image_name\": \"${{ steps.image_tag.outputs.image }}\",
            \"docker_registry_image_tag\": \"${{ steps.image_tag.outputs.tag }}\"
          }"

      - name: Redeploy Coolify Migration Image
        if: ${{ matrix.service != 'notification-service' && matrix.service != 'gateway' }}
        id: redeploy-and-deploymentID
        run: |
          RESPONSE=$(curl -sS -f \
          --request GET "${{ steps.dynamic-env.outputs.webhook_migration_url }}" \
          --header "Authorization: Bearer ${{ needs.detect-changes.outputs.coolify-token }}")

          echo "$RESPONSE"
          DEPLOYMENT_UUID=$(echo "$RESPONSE" | jq -r ".deployments[0].deployment_uuid")
          echo "deployment_uuid=$DEPLOYMENT_UUID" >> $GITHUB_OUTPUT

      - name: Check redeployment status of Coolify Migration Image
        if: ${{ matrix.service != 'notification-service' && matrix.service != 'gateway' }}
        id: check-status-deployment
        timeout-minutes: 10
        run: |
          while true; do
            STATUS=$(curl -sS -f \
              "https://${{ needs.detect-changes.outputs.coolify-url }}/api/v1/deployments/${{ steps.redeploy-and-deploymentID.outputs.deployment_uuid }}" \
              -H "Authorization: Bearer ${{ needs.detect-changes.outputs.coolify-token }}" | jq -r ".status")

            echo "Estado actual de la migración: $STATUS"  
            if [ "$STATUS" = "finished" ]; then
              echo "Migración completada con éxito."
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "La migración falló en Coolify."
              exit 1
            fi

            sleep 5
          done

      # --- Pasos de Despliegue de la Aplicación (para todos los servicios) ---

      - name: Set Coolify Application Tag
        run: |
          curl -f "https://${{ needs.detect-changes.outputs.coolify-url }}/api/v1/applications/${{ steps.dynamic-env.outputs.app_uuid }}" \
          --request PATCH \
          --header "Authorization: Bearer ${{ needs.detect-changes.outputs.coolify-token }}" \
          --header "Content-Type: application/json" \
          --data "{
            \"docker_registry_image_name\": \"${{ steps.image_tag.outputs.image }}\",
            \"docker_registry_image_tag\": \"${{ steps.image_tag.outputs.tag }}\"
          }"

      - name: Redeploy Coolify Application Image
        run: |
          curl -sS -f --request GET "${{ steps.dynamic-env.outputs.webhook_app_url }}" \
          --header "Authorization: Bearer ${{ needs.detect-changes.outputs.coolify-token }}"
