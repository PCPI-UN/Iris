apiVersion: v1
kind: Secret
metadata:
  name: pcpi-secrets
  namespace: pcpi
type: Opaque
stringData:
  # Seed Data
  SEED_ADMIN_EMAIL: ""
  SEED_ADMIN_PASSWORD: ""
  SEED_TEST_USER_PASSWORD: ""

  # Database configurations
  AUTH_DB_PASSWORD: "REPLACE_WITH_AUTH_DATABASE_PASSWORD"
  EVALUATION_DB_PASSWORD: "REPLACE_WITH_EVALUATION_DATABASE_PASSWORD"
  EVENT_DB_PASSWORD: "REPLACE_WITH_EVENT_DATABASE_PASSWORD"
  INVITATION_DB_PASSWORD: "REPLACE_WITH_INVITATION_DATABASE_PASSWORD"
  PROJECT_DB_PASSWORD: "REPLACE_WITH_PROJECT_DATABASE_PASSWORD"

  # Auth Service
  # RSA Private key in base64 (used to sign JWT access tokens)
  JWT_PRIVATE_KEY: "REPLACE_WITH_BASE64_RSA_KEY"
  JWT_PUBLIC_KEY: "REPLACE_WITH_BASE64_RSA_KEY"
  JWT_REFRESH_PRIVATE_KEY: "REPLACE_WITH_BASE64_RSA_KEY"
  JWT_REFRESH_PUBLIC_KEY: "REPLACE_WITH_BASE64_RSA_KEY"

  # Azure Blob Storage
  AZURE_BLOB_SAS_URL: ""
  AZURE_ACCOUNT_NAME: ""
  AZURE_ACCOUNT_KEY: ""
  AZURE_CONTAINER: ""

  # EmailJS (Notification Service)
  EMAILJS_SERVICE_ID: ""
  EMAILJS_TEMPLATE_ID: ""
  EMAILJS_PUBLIC_KEY: ""
  EMAILJS_PRIVATE_KEY: ""

  # Azure Communication Services Email (Fallback)
  ACS_CONNECTION_STRING: ""
  ACS_SENDER_ADDRESS: ""

  AZURE_TENANT_ID: ""
  AZURE_CLIENT_ID: ""
  AZURE_CLIENT_SECRET: ""
