apiVersion: v1
kind: Secret
metadata:
  name: pcpi-secrets
  namespace: pcpi
type: Opaque
stringData:
  # Auth Service
  # RSA Private key in base64 (used to sign JWT access tokens)
  JWT_PRIVATE_KEY: "your_base64_encoded_rsa_private_key"

  # EmailJS (Notification Service)
  EMAILJS_SERVICE_ID: "your_emailjs_service_id"
  EMAILJS_TEMPLATE_ID: "your_emailjs_template_id"
  EMAILJS_PUBLIC_KEY: "your_emailjs_public_key"
  EMAILJS_PRIVATE_KEY: "your_emailjs_private_key"

  # Azure Communication Services Email (Fallback)
  ACS_CONNECTION_STRING: "your_acs_connection_string"
  ACS_SENDER_ADDRESS: "your_acs_sender_address"
