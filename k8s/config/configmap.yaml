apiVersion: v1
kind: ConfigMap
metadata:
  name: pcpi-config
  namespace: pcpi
data:
  # Common
  NODE_ENV: "production"
  FRONTEND_URL: "http://localhost:3001"
  ALLOWED_ORIGINS: "http://localhost:3001"
  ALLOW_INSECURE_COOKIES: "true"
  COOKIE_DOMAIN: ""
  REDIRECT_URI: ""

  # Auth Service
  AUTH_GRPC_HOST: "0.0.0.0"
  AUTH_GRPC_PORT: "50051"
  PASSWORD_RESET_TOKEN_EXPIRY_MINUTES: "15"
  ACCOUNT_SETUP_TOKEN_EXPIRY_SECONDS: "86400"

  # Evaluation Service
  EVALUATION_GRPC_HOST: "0.0.0.0"
  EVALUATION_GRPC_PORT: "50052"

  # Event Service
  EVENT_GRPC_HOST: "0.0.0.0"
  EVENT_GRPC_PORT: "50053"

  # Invitation Service
  INVITATION_GRPC_HOST: "0.0.0.0"
  INVITATION_GRPC_PORT: "50054"
  INVITATION_EXPIRATION_SECONDS: "172800"

  # Project Service
  PROJECT_GRPC_HOST: "0.0.0.0"
  PROJECT_GRPC_PORT: "50055"

  # Gateway Service URLs
  AUTH_SERVICE_URL: "auth-service:50051"
  EVALUATION_SERVICE_URL: "evaluation-service:50052"
  EVENT_SERVICE_URL: "event-service:50053"
  INVITATION_SERVICE_URL: "invitation-service:50054"
  PROJECT_SERVICE_URL: "project-service:50055"
  NOTIFICATION_SERVICE_URL: "notification-service:50056"

  # JWT
  JWT_ACCESS_TOKEN_EXPIRATION: "15m"
  JWT_REFRESH_TOKEN_EXPIRATION: "7d"
  JWT_REFRESH_TOKEN_EXPIRATION_DAYS: "7"

  # Notification Service
  NOTIFICATION_GRPC_HOST: "0.0.0.0"
  NOTIFICATION_GRPC_PORT: "50056"
  # Ordered email providers: primary first, then fallback (acs, emailjs)
  EMAIL_PROVIDERS: "acs,emailjs"
