apiVersion: v1
kind: ConfigMap
metadata:
  name: pcpi-config
  namespace: pcpi
data:
  # Common
  NODE_ENV: "development"

  # Database configurations
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # Auth Service
  AUTH_DATABASE_URL: "postgresql://postgres:postgres@auth-db:5432/auth_service"
  AUTH_GRPC_HOST: "0.0.0.0"
  AUTH_GRPC_PORT: "50051"
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""

  # Evaluation Service
  EVALUATION_DATABASE_URL: "postgresql://postgres:postgres@evaluation-db:5432/evaluation_service"
  EVALUATION_GRPC_HOST: "0.0.0.0"
  EVALUATION_GRPC_PORT: "50052"

  # Event Service
  EVENT_DATABASE_URL: "postgresql://postgres:postgres@event-db:5432/event_service"
  EVENT_GRPC_HOST: "0.0.0.0"
  EVENT_GRPC_PORT: "50053"

  # Invitation Service
  INVITATION_DATABASE_URL: "postgresql://postgres:postgres@invitation-db:5432/invitation_service"
  INVITATION_GRPC_HOST: "0.0.0.0"
  INVITATION_GRPC_PORT: "50054"

  # Project Service
  PROJECT_DATABASE_URL: "postgresql://postgres:postgres@project-db:5432/project_service"
  PROJECT_GRPC_HOST: "0.0.0.0"
  PROJECT_GRPC_PORT: "50055"

  # Gateway Service URLs
  AUTH_SERVICE_URL: "auth-service:50051"
  EVALUATION_SERVICE_URL: "evaluation-service:50052"
  EVENT_SERVICE_URL: "event-service:50053"
  INVITATION_SERVICE_URL: "invitation-service:50054"
  PROJECT_SERVICE_URL: "project-service:50055"

  # Notification Service
  NOTIFICATION_DATABASE_URL: "postgresql://postgres:postgres@notification-db:5432/notification_service"
  # Ordered email providers: primary first, then fallback (acs, emailjs)
  EMAIL_PROVIDERS: "acs,emailjs"
  EMAIL_PUBLIC_KEY: "JSamv4icvDDEi6eMZ"
  EMAIL_PRIVATE_KEY: "v2Pi81dRQn5520f8mWlq8"
  EMAILJS_TEMPLATE_PROJECT-CONFIRMATION_ID: "template_mqar2l3"
