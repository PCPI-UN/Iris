apiVersion: v1
kind: Service
metadata:
  name: evaluation-db
  namespace: pcpi
spec:
  selector:
    app: evaluation-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evaluation-db
  namespace: pcpi
spec:
  serviceName: evaluation-db
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-db
  template:
    metadata:
      labels:
        app: evaluation-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: evaluation_service
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: EVALUATION_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          startupProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: evaluation-db-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: evaluation-db-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
