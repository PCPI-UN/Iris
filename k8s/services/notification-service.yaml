apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: pcpi
spec:
  selector:
    app: notification-service
  ports:
    - port: 50056
      targetPort: 50056
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pcpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: pcpi/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50056
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: NODE_ENV
            - name: EMAIL_PROVIDERS
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: EMAIL_PROVIDERS
            # EmailJS
            - name: EMAILJS_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: EMAILJS_SERVICE_ID
                  optional: true
            - name: EMAILJS_TEMPLATE_ID
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: EMAILJS_TEMPLATE_ID
                  optional: true
            - name: EMAILJS_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: EMAILJS_PUBLIC_KEY
                  optional: true
            - name: EMAILJS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: EMAILJS_PRIVATE_KEY
                  optional: true
            # Azure Communication Services Email (Fallback)
            - name: ACS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: ACS_CONNECTION_STRING
                  optional: true
            - name: ACS_SENDER_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: ACS_SENDER_ADDRESS
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 15
            periodSeconds: 10
