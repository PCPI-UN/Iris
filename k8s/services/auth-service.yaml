apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pcpi
spec:
  selector:
    app: auth-service
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pcpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: pcpi/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: AUTH_DATABASE_URL
            - name: GRPC_HOST
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: AUTH_GRPC_HOST
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: AUTH_GRPC_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: NODE_ENV
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: pcpi-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: pcpi-config
                  key: JWT_PUBLIC_KEY
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
